name: Günlük Aktüel Broşür & Ürün Senkronizasyonu

on:
  schedule:
    # Her gün Türkiye saatiyle 08:00 ve 16:00 (UTC 05:00 ve 13:00)
    - cron: '0 5,13 * * *'
  workflow_dispatch: # İstendiğinde GitHub web arayüzünden manuel tek tıkla çalıştırma

jobs:
  sync-market-catalogs:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla
        uses: actions/checkout@v4

      - name: ⚙️ Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Bağımlılıkları Yükle
        run: npm ci || npm install

      - name: 🛒 Broşür ve Ürünleri Tara (Akıllı Atlama Devrede)
        run: node scripts/scrape_all_catalogs.js --sync

      - name: 🔍 Veri Bütünlüğü Doğrulaması
        run: node scripts/catalog_manager.js validate

      - name: 🚀 Değişiklik Varsa Sürümü Yükselt ve Kaydet
        run: |
          if [ -n "$(git status --porcelain catalogs.json data/catalogs.json)" ]; then
            node scripts/catalog_manager.js bump
            git config --local user.email "action@github.com"
            git config --local user.name "Aktuel Urunler Otomasyon Robotu"
            git add catalogs.json data/catalogs.json || true
            git commit -m "🤖 Otomatik Güncelleme: Yeni market katalogları ve ürünleri senkronize edildi"
            git push
          else
            echo "✨ Tüm katalog ve ürünler güncel, yeni veri tespit edilmedi."
          fi
