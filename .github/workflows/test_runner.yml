name: Test A101 Runner Connectivity

on:
  workflow_dispatch:

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run All Campaigns Test on Ubuntu
        run: node scripts/test_all_campaigns_runner.js
